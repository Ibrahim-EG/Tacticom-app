name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # No gradlew is committed to this repo (a correct wrapper jar is a
      # binary file that needs an existing Gradle install to generate
      # safely -- easier and just as reliable to let this action install
      # Gradle directly on the runner instead).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # assembleDebug uses Android's built-in auto-generated debug
      # keystore -- no signing secrets needed for this first build. See
      # the README for turning this into a signed release build once
      # this is confirmed working end to end.
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tacticom-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
